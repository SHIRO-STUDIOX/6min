name: SQLite local parity
on: [push, pull_request]
jobs:
  sqlite:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ordered PowerShell local setup without database services
        shell: pwsh
        run: ./start.ps1 -SetupOnly
      - run: npm test
      - run: npm run test:integration:sqlite
      - run: npm run lint
      - run: node --import ./scripts/load-local-sqlite.mjs node_modules/next/dist/bin/next build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:sqlite
      - name: Actual PowerShell launcher and guest browser flow
        run: npm run test:local-start
